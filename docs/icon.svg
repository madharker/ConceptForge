<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ConceptForge icon: anvil + spark concept
       Dark base + gold accent (matches app theme: --bg #0f1115, --accent #c9a96e)
       The anvil stands for "forging"; the rising spark/flame stands for "concept". -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8b87c"/>
      <stop offset="1" stop-color="#c9a96e"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c9a96e" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#d8b87c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7eb8a2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#d8b87c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d8b87c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="56" fill="#0f1115"/>

  <!-- soft glow behind the spark -->
  <circle cx="128" cy="118" r="86" fill="url(#glow)"/>

  <!-- rising concept spark / flame -->
  <path d="M128 38
           C 138 70, 158 86, 150 112
           C 166 104, 170 92, 172 84
           C 178 110, 162 138, 142 150
           C 156 142, 168 130, 172 122
           C 168 152, 148 172, 128 178
           C 108 172, 88 152, 84 122
           C 88 130, 100 142, 114 150
           C 94 138, 78 110, 84 84
           C 86 92, 90 104, 106 112
           C 98 86, 118 70, 128 38 Z"
        fill="url(#spark)"/>

  <!-- central bright core of the spark -->
  <path d="M128 96
           C 134 116, 140 126, 136 142
           C 132 152, 124 152, 120 142
           C 116 126, 122 116, 128 96 Z"
        fill="#f5e6c0" opacity="0.92"/>

  <!-- anvil: top face -->
  <path d="M64 178
           L 192 178
           L 188 192
           L 168 192
           L 162 184
           L 94 184
           L 88 192
           L 68 192 Z"
        fill="url(#gold)"/>

  <!-- anvil: horn (left point) -->
  <path d="M64 178
           L 36 186
           L 40 192
           L 64 192 Z"
        fill="#c9a96e"/>

  <!-- anvil: base -->
  <path d="M96 200
           L 160 200
           L 152 220
           L 104 220 Z"
        fill="url(#gold)"/>

  <!-- anvil: foot -->
  <rect x="92" y="220" width="72" height="10" rx="3" fill="#c9a96e"/>

  <!-- subtle highlight on anvil top -->
  <path d="M70 182 L 186 182 L 184 186 L 72 186 Z" fill="#e8d5a8" opacity="0.6"/>
</svg>
